name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check browser JavaScript
        run: node --check site/app.js

  build-pages:
    name: Build or reuse validated Pages artifact
    needs: validate
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: crdt-lab-pages-v1
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      build_command: ./scripts/build-pages.sh
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7
