name: Pages

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crdt-lab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reuse validated Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      artifact_key: crdt-lab-pages-v1
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      build_command: ./scripts/build-pages.sh
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  deploy:
    name: Pages deploy
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: dist
      prebuilt_artifact_run_id: ${{ needs.build.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
      concurrency_group: crdt-lab-pages
      cancel_in_progress: false
