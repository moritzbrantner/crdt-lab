[package]
name = "crdt-lab-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bridge for the CRDT Lab browser experiments"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crdt-lab = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
